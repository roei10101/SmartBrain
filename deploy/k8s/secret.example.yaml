# Template only - this file is NOT part of the kustomization and holds no real values.
# Create the real secret straight from the command line instead of committing it:
#
#   kubectl -n smartbrain create secret generic smartbrain-secrets \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)"
#
apiVersion: v1
kind: Secret
metadata:
  name: smartbrain-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  SECRET_KEY: change-me
